name: 每日生成各板块内容

on:
  schedule:
    # 每天 22:00 UTC = 北京时间 06:00（在新闻抓取之前，保证白天内容已更新）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 生成每日内容（需配置 LLM Secrets 才会真正生成）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python backend/generate_daily.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p backend/data/daily
          git add backend/data/daily/ || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动生成每日内容 $(date +'%Y-%m-%d')"
            git push
          fi
