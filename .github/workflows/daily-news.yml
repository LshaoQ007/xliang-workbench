name: 每日抓取亚马逊新闻

on:
  schedule:
    # 每天 23:30 UTC = 北京时间 07:30
    - cron: '30 23 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许写回 news.json

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓取新闻并写回
        env:
          PUSH_HOUR: '7'
          PUSH_MINUTE: '30'
          NEWS_QUERIES: 'Amazon seller policy,Amazon FBA update,Amazon sellers news,Amazon Seller Central,amazon.com marketplace'
          AI_NEWS_QUERIES: 'OpenAI,Anthropic Claude,Google DeepMind,Gemini AI,LLM release,AI model update,Midjourney,AI agent platform,DeepSeek,Qwen Alibaba,AI video generation'
          # 可选：配置以下 Secrets 后自动生成中文摘要（不填则复用已有摘要）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python backend/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/news.json backend/data/news_ai.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新新闻与 AI 快讯 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
